# Dev stack only. Mounted over nginx.conf by docker-compose.yml so the image
# keeps serving static files alone wherever a proxy (Caddy) sits in front.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 30m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
