server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Report-only. kc.alialjaffer.com must match VITE_OIDC_AUTHORITY. Rename to Content-Security-Policy to enforce.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-ptZjuukWzYd/yqzB+Z9gijnBH/jEZB2BxsY762NnFPU='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://kc.alialjaffer.com; frame-src https://kc.alialjaffer.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; require-trusted-types-for 'script'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
