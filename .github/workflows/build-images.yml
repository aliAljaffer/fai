name: Build and push images

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: alialjaffer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/fai-backend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/fai-backend:${{ github.sha }}

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: frontend
          push: true
          # VITE_OIDC_AUTHORITY baked in for the kubernetes deployment (see
          # README's docker-compose note: that deployment needs a separately
          # built image with this build-arg omitted).
          build-args: |
            VITE_OIDC_AUTHORITY=https://kc.alialjaffer.com/realms/homelab
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/fai-frontend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/fai-frontend:${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          # Compose gates every request with Caddy Basic auth; its SPA must not
          # attempt client-side OIDC.
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/fai-frontend:compose
            ${{ env.REGISTRY }}/${{ env.OWNER }}/fai-frontend:compose-${{ github.sha }}

  update-manifests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HOMELAB_APP_ID }}
          private-key: ${{ secrets.HOMELAB_APP_PRIVATE_KEY }}
          owner: aliAljaffer
          repositories: homelab

      - name: Check out the homelab manifests
        uses: actions/checkout@v4
        with:
          repository: aliAljaffer/homelab
          token: ${{ steps.app-token.outputs.token }}
          path: homelab

      - name: Pin the Fai image digests
        working-directory: homelab
        env:
          BACKEND_DIGEST: ${{ needs.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ needs.frontend.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "Skipping: main moved to $latest."
            exit 0
          fi
          test -n "$BACKEND_DIGEST"
          test -n "$FRONTEND_DIGEST"
          sed -i -E "s|ghcr.io/alialjaffer/fai-backend@sha256:[0-9a-f]{64}|ghcr.io/alialjaffer/fai-backend@${BACKEND_DIGEST}|" kubernetes/apps/fai/backend-deployment.yaml
          sed -i -E "s|ghcr.io/alialjaffer/fai-frontend@sha256:[0-9a-f]{64}|ghcr.io/alialjaffer/fai-frontend@${FRONTEND_DIGEST}|" kubernetes/apps/fai/frontend-deployment.yaml
          grep -q "ghcr.io/alialjaffer/fai-backend@${BACKEND_DIGEST}" kubernetes/apps/fai/backend-deployment.yaml
          grep -q "ghcr.io/alialjaffer/fai-frontend@${FRONTEND_DIGEST}" kubernetes/apps/fai/frontend-deployment.yaml
          if git diff --quiet; then
            echo "Fai images are already pinned."
            exit 0
          fi
          git config user.name "fai-manifest-bot"
          git config user.email "fai-manifest-bot@users.noreply.github.com"
          git add kubernetes/apps/fai/backend-deployment.yaml kubernetes/apps/fai/frontend-deployment.yaml
          git commit -m "fai: pin images for ${GITHUB_SHA:0:7}"
          for _ in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase
          done
          exit 1
