name: Release desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example v0.1.0)
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  NODE_VERSION: "22"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            arch: arm64
            goarch: arm64
          - name: macOS x64
            os: macos-14
            arch: x64
            goarch: amd64
          - name: Linux x64
            os: ubuntu-latest
            arch: x64
            goarch: amd64
          - name: Windows x64
            os: windows-latest
            arch: x64
            goarch: amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ env.RELEASE_TAG }}
        run: npm ci && npm run build

      - name: Build backend
        working-directory: backend
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" \
            -o "bin/fai-backend${{ matrix.ext }}" ./cmd/api

      - name: Set app version
        working-directory: electron
        shell: bash
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Package
        working-directory: electron
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npx electron-builder --win "--${{ matrix.arch }}" --publish never
          elif [ "$RUNNER_OS" = "macOS" ]; then
            npx electron-builder --mac "--${{ matrix.arch }}" --publish never
          else
            npx electron-builder --linux "--${{ matrix.arch }}" --publish never
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: fai-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            electron/release/*.dmg
            electron/release/*.zip
            electron/release/*.exe
            electron/release/*.AppImage
            electron/release/*.tar.gz
            electron/release/*.blockmap
            electron/release/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Assemble release files
        run: python3 .github/merge-update-metadata.py --artifacts artifacts --dist dist

      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: fai ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: dist/*

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: src

      - name: Checkout tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap
          chmod 600 ~/.ssh/tap
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          GIT_SSH_COMMAND='ssh -i ~/.ssh/tap -o IdentitiesOnly=yes' \
            git clone git@github.com:aliAljaffer/homebrew-tap.git tap
          git -C tap config core.sshCommand "ssh -i $HOME/.ssh/tap -o IdentitiesOnly=yes"

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Update cask
        run: python3 src/.github/homebrew/update.py --tap tap --dist dist --tag "$RELEASE_TAG"

      - name: Commit and push
        working-directory: tap
        env:
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/fai.rb
          if git diff --cached --quiet; then
            echo "cask already up to date"
            exit 0
          fi
          git commit -m "fai ${VERSION#v}"
          git push
