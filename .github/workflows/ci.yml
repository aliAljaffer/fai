name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "brand/**"
      - "LICENSE"
      - ".gitignore"
      - "docker-compose*.yml"
      - "Caddyfile.prod"
      - ".env.prod.example"
      - "Makefile"

permissions:
  contents: read

jobs:
  backend:
    runs-on: arc-runner-fai
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner toolchain
        run: go version

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test ./...

      - name: Build
        working-directory: backend
        run: go build ./...

  frontend:
    runs-on: arc-runner-fai
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner toolchain
        run: node --version

      - run: npm ci
        working-directory: frontend

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
