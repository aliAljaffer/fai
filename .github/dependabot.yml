version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns:
          - "*"

  - package-ecosystem: npm
    directories:
      - /frontend
      - /electron
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      - dependency-name: '@fullcalendar/*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
