# Production stack: published images, Caddy TLS and Basic auth, SQLite.
# Set FAI_DOMAIN and FAI_AUTH_PASSWORD in .env first. See README.
name: fai

services:
  backend:
    image: ghcr.io/alialjaffer/fai-backend:latest
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/fai.db}
      AUTH_MODE: proxy-header
      PORT: "8080"
      ATTACHMENTS_DIR: ${ATTACHMENTS_DIR:-/data/attachments}
      NTFY_URL: ${NTFY_URL:-http://ntfy}
      NTFY_TOPIC: ${NTFY_TOPIC:-fai-reminders}
      TELEGRAM_STATE_FILE: ${TELEGRAM_STATE_FILE:-/data/fai-telegram-offset}
    volumes:
      - faidata:/data
    expose: ["8080"]
    restart: unless-stopped

  frontend:
    image: ghcr.io/alialjaffer/fai-frontend:compose
    expose: ["80"]
    depends_on: [backend]
    restart: unless-stopped

  ntfy:
    image: binwiederhier/ntfy
    command: serve
    volumes: [ntfydata:/var/lib/ntfy]
    environment:
      NTFY_UPSTREAM_BASE_URL: "https://ntfy.sh"
    restart: unless-stopped

  caddy: # reverse proxy, automatic TLS, HTTP Basic auth gate
    image: caddy:alpine
    ports: ["80:80", "443:443"]
    env_file: .env # FAI_DOMAIN, FAI_AUTH_USER, FAI_AUTH_PASSWORD
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - ./caddy-entrypoint.sh:/entrypoint.sh:ro
      - caddydata:/data
    depends_on: [backend, frontend]
    restart: unless-stopped

volumes:
  faidata: {}
  ntfydata: {}
  caddydata: {}
