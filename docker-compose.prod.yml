services:
  backend:
    image: ghcr.io/alialjaffer/fai-backend:latest
    env_file: .env.prod
    environment:
      DATABASE_URL: sqlite:///data/fai.db
      AUTH_MODE: proxy-header
      PORT: "8080"
      NTFY_URL: http://ntfy
      ATTACHMENTS_DIR: /data/attachments
      PUBLIC_URL: https://${FAI_DOMAIN}
    volumes:
      - faidata:/data
    expose: ["8080"]
    restart: unless-stopped

  frontend:
    image: ghcr.io/alialjaffer/fai-frontend:compose
    expose: ["80"]
    depends_on: [backend]
    restart: unless-stopped

  ntfy: # bundled, not shared cluster infra — there's no cluster here
    image: binwiederhier/ntfy
    command: serve
    volumes: [ntfydata:/var/lib/ntfy]
    environment:
      NTFY_UPSTREAM_BASE_URL: "https://ntfy.sh"
    restart: unless-stopped

  caddy: # reverse proxy + automatic TLS + HTTP Basic auth gate
    image: caddy:alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - caddydata:/data
    env_file: .env.prod # FAI_DOMAIN, FAI_AUTH_USER, FAI_AUTH_HASH
    depends_on: [backend, frontend]
    restart: unless-stopped

volumes:
  faidata: {}
  ntfydata: {}
  caddydata: {}
